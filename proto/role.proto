syntax = "proto3";

// Role Service provides CRUD operations for managing roles within groups.
// A Role is a named subset of permissions drawn from its parent Group.
//
// Roles are the primary mechanism for granting access to Subjects.
// A Subject can be assigned multiple Roles, and their effective permissions
// are the union of all assigned Roles' permissions.
//
// Key constraint: A Role's permissions must always be a subset of
// its parent Group's permissions (the Subset Constraint). This is
// enforced at the service implementation layer.
package role;

import "common.proto";
import "validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/adityakw90/service-access-proto/gen/go/role";

// Role represents a named subset of permissions within a group.
// Roles are assigned to Subjects to grant access.
message Role {
  // uid is the public unique identifier for this role.
  string uid = 1;

  // group_uid identifies the parent group that owns this role.
  // A role always belongs to exactly one group.
  string group_uid = 2;

  // name is the human-readable name of this role.
  // Must be unique within the parent group.
  string name = 3;

  // description explains the role's purpose and intended use.
  string description = 4;

  // created_at is the Unix timestamp (seconds) when this role was created.
  int64 created_at = 5;

  // updated_at is the Unix timestamp (seconds) of the last modification.
  int64 updated_at = 6;
}

// RoleService provides CRUD operations for managing roles.
service RoleService {
  // CreateRole creates a new role within a group.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/v1/roles"
      body: "*"
    };
  }

  // GetRole retrieves a role by its public UID.
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {
      get: "/v1/roles/{uid}"
    };
  }

  // UpdateRole modifies an existing role's details.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/v1/roles/{uid}"
      body: "*"
    };
  }

  // DeleteRole permanently removes a role by its UID.
  // This will cascade to remove all subject assignments for this role.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {
      delete: "/v1/roles/{uid}"
    };
  }

  // ListRoles returns a paginated list of roles.
  // Can optionally filter by group_uid.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/v1/roles"
    };
  }

  // AssignRolePermission adds a permission to a role.
  rpc AssignRolePermission(AssignRolePermissionRequest) returns (AssignRolePermissionResponse) {
    option (google.api.http) = {
      post: "/v1/roles/{role_uid}/permissions"
      body: "*"
    };
  }

  // RevokeRolePermission removes a permission from a role.
  rpc RevokeRolePermission(RevokeRolePermissionRequest) returns (RevokeRolePermissionResponse) {
    option (google.api.http) = {
      delete: "/v1/roles/{role_uid}/permissions/{permission_uid}"
    };
  }

  // ListRolePermissions returns all permissions assigned to a role.
  rpc ListRolePermissions(ListRolePermissionsRequest) returns (ListRolePermissionsResponse) {
    option (google.api.http) = {
      get: "/v1/roles/{role_uid}/permissions"
    };
  }
}

// Request/Response stubs - will be implemented in later tasks
message CreateRoleRequest {}
message CreateRoleResponse {}
message GetRoleRequest {
  string uid = 1;
}
message UpdateRoleRequest {
  string uid = 1;
}
message UpdateRoleResponse {}
message DeleteRoleRequest {
  string uid = 1;
}
message DeleteRoleResponse {}
message ListRolesRequest {}
message ListRolesResponse {}
message AssignRolePermissionRequest {
  string role_uid = 1;
}
message AssignRolePermissionResponse {}
message RevokeRolePermissionRequest {
  string role_uid = 1;
  string permission_uid = 2;
}
message RevokeRolePermissionResponse {}
message ListRolePermissionsRequest {
  string role_uid = 1;
}
message ListRolePermissionsResponse {}
