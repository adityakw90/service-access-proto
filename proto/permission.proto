syntax = "proto3";

// Permission Service provides CRUD operations for managing access control permissions.
// A permission defines a specific action that can be performed on a resource.
//
// Permissions are the fundamental unit of access control in this system.
// They are assigned to Groups, and indirectly to Roles through their parent Group.
//
// Resource-Action Examples:
// - resource: "invoices", action: "read" → permission to read invoices
// - resource: "users", action: "write" → permission to modify users
// - resource: "settings", action: "admin" → full administrative access
package permission;

import "google/protobuf/timestamp.proto";
import "common.proto";

option go_package = "github.com/adityakw90/service-access-proto/gen/go/permission";

// Permission represents a granular access control unit.
// It defines what action can be performed on a specific resource.
message Permission {
  string uid = 1; // uid is the public unique identifier for this permission
  string resource = 2; // resource identifies the domain entity this permission applies to
  string action = 3; // action specifies the operation allowed on the resource
  string description = 4; // description provides a human-readable explanation of this permission's
  google.protobuf.Timestamp created_at = 5; // timestamp of the creation
  google.protobuf.Timestamp updated_at = 6; // timestamp of the last update
}

// CreatePermissionRequest contains the fields needed to create a new permission.
message CreatePermissionRequest {
  string resource = 1; // resource identifies the domain entity (e.g., "invoices", "users").
  string action = 2; // action specifies the operation (e.g., "read", "write", "delete", "admin").
  string description = 3; // description is an optional human-readable explanation.
}

// CreatePermissionResponse returns the created permission.
message CreatePermissionResponse {
  string uid = 1; // uid of the created permission
}

// GetPermissionRequest is used to retrieve a permission by its UID.
message GetPermissionRequest {
  string uid = 1; // uid is the public unique identifier of the permission.
}

// UpdatePermissionRequest contains fields to update an existing permission.
message UpdatePermissionRequest {
  string uid = 1; // uid identifies which permission to update.
  string resource = 2; // resource is the new resource identifier.
  string action = 3; // action is the new action identifier.
  string description = 4; // description is the new description.
}

// DeletePermissionRequest is used to delete a permission by its UID.
message DeletePermissionRequest {
  string uid = 1; // uid identifies which permission to delete.
}

// ListPermissionsRequest is used to list permissions with pagination.
message ListPermissionsRequest {
  common.Pagination pagination = 1; // pagination controls the page size and ordering.
  FilterRequest filter=2; // filter for the list of permissions
}

message FilterRequest {
  repeated string uids = 1; // list of uids to get
  optional string resource = 2; // exact match
  optional string action = 3; // exact match
  optional string query = 4; // query is a general search term that can match any field.
}

// ListPermissionsResponse returns a paginated list of permissions.
message ListPermissionsResponse {
  repeated Permission items = 1; // list of permissions
  common.Meta meta = 2; // meta contains pagination metadata (total, pages, etc.).
}

// PermissionService provides CRUD operations for managing permissions.
service PermissionService {
  // CreatePermission creates a new permission.
  rpc CreatePermission(CreatePermissionRequest) returns (CreatePermissionResponse);

  // GetPermission retrieves a permission by UID.
  rpc GetPermission(GetPermissionRequest) returns (Permission);

  // UpdatePermission modifies an existing permission.
  rpc UpdatePermission(UpdatePermissionRequest) returns (common.Success);

  // DeletePermission permanently removes a permission.
  rpc DeletePermission(DeletePermissionRequest) returns (common.Success);

  // ListPermissions returns a paginated list of permissions.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
}
