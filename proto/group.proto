syntax = "proto3";

// Group Service provides CRUD operations for managing permission groups.
// A Group is a collection of permissions that can be assigned to Roles.
//
// Groups serve as organizational containers for related permissions.
// For example, an "invoice-management" group might contain permissions
// for reading, writing, and deleting invoices.
//
// Roles are always created within a specific Group, and a Role's
// permissions must be a subset of its parent Group's permissions
// (the Subset Constraint).
package access.group;

import "google/protobuf/timestamp.proto";
import "common.proto";

option go_package = "github.com/adityakw90/service-access-proto/gen/go/group";

// Group represents a collection of permissions.
// Groups organize related permissions and serve as parents for Roles.
message Group {
  string uid = 1; // public unique identifier for this group
  string name = 2; // human-readable name of this group
  string description = 3; // description explains the purpose and scope of this group
  google.protobuf.Timestamp created_at = 4; // Unix timestamp when this group was created
  google.protobuf.Timestamp updated_at = 5; // Unix timestamp of the last modification
}

// GroupPermission represents a permission assigned to a group.
message GroupPermission {
  string uid = 1; // public unique identifier for this group permission
  string group_uid = 2; // uid of the group
  string permission_uid = 3; // uid of the permission
  string permission_resource = 4; // resource of the permission
  string permission_action = 5; // action of the permission
  string permission_description = 6; // description of the permission
  google.protobuf.Timestamp created_at = 7; // Unix timestamp when this group permission was created
}

// ListRequest is used to list groups with pagination.
message ListRequest {
  common.Pagination pagination = 1; // pagination controls the page size and ordering.
  FilterRequest filter = 2; // filter for the list of groups
}

message FilterRequest {
  repeated string uids = 1; // list of uids to get
  optional string name = 2; // exact match
  optional string query = 3; // query is a general search term that can match any field.
}

// ListResponse returns a paginated list of groups.
message ListResponse {
  repeated Group items = 1; // list of groups
  common.Meta meta = 2; // meta contains pagination metadata.
}

// GetRequest is used to retrieve a group by its UID.
message GetRequest {
  string uid = 1; // uid of the group to retrieve
}

// CreateRequest contains the fields needed to create a new group.
message CreateRequest {
  string name = 1; // human-readable name of this group, must be unique across all groups
  string description = 2; // description explains the purpose and scope of this group
}

// CreateResponse returns the created group.
message CreateResponse {
  string uid = 1; // uid of the created group
}

// UpdateRequest contains fields to update an existing group.
message UpdateRequest {
  string uid = 1; // uid of the group to update
  string name = 2; // new name for the group
  string description = 3; // new description for the group
}

// DeleteRequest is used to delete a group by its UID.
message DeleteRequest {
  string uid = 1; // uid of the group to delete
}

// UpdatePermissionRequest contains fields to update an existing group permission.
message UpdatePermissionRequest {
  string group_uid = 1; // group_uid identifies which group to receive the permission.
  repeated string permission_uids = 2; // permission_uids identify which permissions to assign.
}

// AssignPermissionRequest adds a permission to a group.
message AssignPermissionRequest {
  string group_uid = 1; // group_uid identifies which group to receive the permission.
  string permission_uid = 2; // permission_uid identifies which permission to assign.
}

// RevokePermissionRequest removes a permission from a group.
message RevokePermissionRequest {
  string group_uid = 1; // group_uid identifies which group to receive the permission.
  string permission_uid = 2; // permission_uid identifies which permission to revoke.
}

// ListPermissionsRequest is used to list a group's permissions.
message ListPermissionsRequest {
  string group_uid = 1; // group_uid identifies which group's permissions to list.
  common.Pagination pagination = 2; // pagination controls the page size and ordering.
  FilterPermissionRequest filter = 3; // filter for the list of group permissions
}

message FilterPermissionRequest {
  repeated string uids = 1; // list of uids to retrieve
  repeated string permission_uids = 2; // list of permission uids to retrieve
  optional string resource = 3; // exact match
  optional string action = 4; // exact match
  optional string query = 5; // query is a general search term that can match any field.
}

// ListPermissionsResponse returns the group's permissions.
// Reuses the permission.ListPermissionsResponse pattern.
message ListPermissionsResponse {
  repeated GroupPermission items = 1; // list of permissions
  common.Meta meta = 2; // meta contains pagination metadata.
}

// GroupService provides CRUD operations for managing groups.
service GroupService {
  // retreive
  rpc List(ListRequest) returns (ListResponse); // List returns a paginated list of all groups.
  rpc Get(GetRequest) returns (Group); // Get retrieves a group by its public UID.

  // Management
  rpc Create(CreateRequest) returns (CreateResponse); // Create creates a new group.
  rpc Update(UpdateRequest) returns (common.Success); // Update modifies an existing group's details.
  rpc Delete(DeleteRequest) returns (common.Success); // Delete permanently removes a group by its UID. This will cascade to delete all roles within the group.

  // Group Permission
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse); // ListPermissions returns all permissions assigned to a group.
  rpc UpdatePermission(UpdatePermissionRequest) returns (common.Success); // UpdatePermission replaces an existing group permission.
  rpc AssignPermission(AssignPermissionRequest) returns (common.Success); // AssignPermission adds a permission to a group.
  rpc RevokePermission(RevokePermissionRequest) returns (common.Success); // RevokePermission removes a permission from a group.
}