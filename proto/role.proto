syntax = "proto3";

// Role Service provides CRUD operations for managing roles within groups.
// A Role is a named subset of permissions drawn from its parent Group.
//
// Roles are the primary mechanism for granting access to Subjects.
// A Subject can be assigned multiple Roles, and their effective permissions
// are the union of all assigned Roles' permissions.
//
// Key constraint: A Role's permissions must always be a subset of
// its parent Group's permissions (the Subset Constraint). This is
// enforced at the service implementation layer.
package role;

import "google/protobuf/timestamp.proto";
import "common.proto";

option go_package = "github.com/adityakw90/service-access-proto/gen/go/role";

// Role represents a named subset of permissions within a group.
// Roles are assigned to Subjects to grant access.
message Role {
  string uid = 1; // public unique identifier for this role
  string group_uid = 2; // parent group that owns this role
  string name = 3; // human-readable name of this role
  string description = 4; // description explains the role's purpose and intended use.
  google.protobuf.Timestamp created_at = 5; // Unix timestamp (seconds) when this role was created.
  google.protobuf.Timestamp updated_at = 6; // Unix timestamp (seconds) of the last modification.
}

message RolePermission {
  string role_uid = 1; // role uid for the role that owns this permission
  string group_permission_uid = 2; // uid of the group permission
  string permission_uid = 3; // uid of the permission
  string permission_resource = 4; // resource of the permission
  string permission_action = 5; // action of the permission
  string permission_description = 6; // description of the permission
  google.protobuf.Timestamp created_at = 7; // Unix timestamp when this group permission was created
}


// CreateRoleRequest contains the fields needed to create a new role.
message CreateRoleRequest {
  string group_uid = 1; // group uid for the group that owns this role
  string name = 2; // human-readable name of this role, must be unique within the parent group
  string description = 3; // description explains the role's purpose and intended use
}

// CreateRoleResponse returns the created role.
message CreateRoleResponse {
  string uid = 1; // uid of the created role
}

// GetRoleRequest is used to retrieve a role by its UID.
message GetRoleRequest {
  string uid = 1; // uid of the role to retrieve
}

// UpdateRoleRequest contains fields to update an existing role.
message UpdateRoleRequest {
  string uid = 1; // uid of the role to update
  string name = 2; // new name for the role
  string description = 3; // new description for the role
}

// DeleteRoleRequest is used to delete a role by its UID.
message DeleteRoleRequest {
  string uid = 1; // uid of the role to delete
}

// ListRolesRequest is used to list roles with optional filtering.
message ListRolesRequest {
  common.Pagination pagination = 1; // pagination controls the page size and ordering
  FilterRequest filter = 2; // filter controls the filtering of roles
}

message FilterRequest {
  repeated string uids = 1; // uid of the role to retrieve
  repeated string group_uids = 2; // group uid for the group that owns this role
  optional string name = 3; // name of the role to retrieve, exact match
  optional string query = 4; // query for the role to retrieve, fuzzy match
}

// ListRolesResponse returns a paginated list of roles.
message ListRolesResponse {
  repeated Role items = 1; // list of roles
  common.Meta meta = 2; // pagination metadata
}

// AssignRolePermissionRequest adds a permission to a role.
message AssignRolePermissionRequest {
  string role_uid = 1; // role uid for the role that owns this permission
  string group_permission_uid = 2; // group permission uid to assign
}

// RevokeRolePermissionRequest removes a permission from a role.
message RevokeRolePermissionRequest {
  string role_uid = 1; // role uid for the role that owns this permission
  string group_permission_uid = 2; // group permission uid to revoke
}

// ListRolePermissionsRequest is used to list a role's permissions.
message ListRolePermissionsRequest {
  string role_uid = 1; // role uid for the role that owns this permission
  common.Pagination pagination = 2; // pagination controls the page size and ordering
  FilterPermissionRequest filter = 3; // filter controls the filtering of roles
}

message FilterPermissionRequest {
  repeated string permission_uids = 1; // permission uid for the permission to retrieve
  optional string resource = 2; // resource for the permission to retrieve, exact match
  optional string action = 3; // action for the permission to retrieve, exact match
  optional string query = 4; // query for the permission to retrieve, fuzzy match
}

// ListRolePermissionsResponse returns the role's permissions.
message ListRolePermissionsResponse {
  repeated RolePermission items = 1; // list of role permissions
  common.Meta meta = 2; // pagination metadata
}

// RoleService provides CRUD operations for managing roles.
service RoleService {
  // CreateRole creates a new role within a group.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);

  // GetRole retrieves a role by its public UID.
  rpc GetRole(GetRoleRequest) returns (Role);

  // UpdateRole modifies an existing role's details.
  rpc UpdateRole(UpdateRoleRequest) returns (common.Success);

  // DeleteRole permanently removes a role by its UID.
  // This will cascade to remove all subject assignments for this role.
  rpc DeleteRole(DeleteRoleRequest) returns (common.Success);

  // ListRoles returns a paginated list of roles.
  // Can optionally filter by group_uid.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // AssignRolePermission adds a permission to a role.
  rpc AssignRolePermission(AssignRolePermissionRequest) returns (common.Success);

  // RevokeRolePermission removes a permission from a role.
  rpc RevokeRolePermission(RevokeRolePermissionRequest) returns (common.Success);

  // ListRolePermissions returns all permissions assigned to a role.
  rpc ListRolePermissions(ListRolePermissionsRequest) returns (ListRolePermissionsResponse);
}