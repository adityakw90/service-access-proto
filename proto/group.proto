syntax = "proto3";

// Group Service provides CRUD operations for managing permission groups.
// A Group is a collection of permissions that can be assigned to Roles.
//
// Groups serve as organizational containers for related permissions.
// For example, an "invoice-management" group might contain permissions
// for reading, writing, and deleting invoices.
//
// Roles are always created within a specific Group, and a Role's
// permissions must be a subset of its parent Group's permissions
// (the Subset Constraint).
package group;

import "common.proto";
import "validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/adityakw90/service-access-proto/gen/go/group";

// Group represents a collection of permissions.
// Groups organize related permissions and serve as parents for Roles.
message Group {
  // uid is the public unique identifier for this group.
  string uid = 1;

  // name is the human-readable name of this group.
  // Must be unique across all groups.
  string name = 2;

  // description explains the purpose and scope of this group.
  string description = 3;

  // created_at is the Unix timestamp (seconds) when this group was created.
  int64 created_at = 4;

  // updated_at is the Unix timestamp (seconds) of the last modification.
  int64 updated_at = 5;
}

// GroupService provides CRUD operations for managing groups.
service GroupService {
  // CreateGroup creates a new permission group.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (google.api.http) = {
      post: "/v1/groups"
      body: "*"
    };
  }

  // GetGroup retrieves a group by its public UID.
  rpc GetGroup(GetGroupRequest) returns (Group) {
    option (google.api.http) = {
      get: "/v1/groups/{uid}"
    };
  }

  // UpdateGroup modifies an existing group's details.
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {
    option (google.api.http) = {
      put: "/v1/groups/{uid}"
      body: "*"
    };
  }

  // DeleteGroup permanently removes a group by its UID.
  // This will cascade to delete all roles within the group.
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {
    option (google.api.http) = {
      delete: "/v1/groups/{uid}"
    };
  }

  // ListGroups returns a paginated list of all groups.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = {
      get: "/v1/groups"
    };
  }

  // AssignGroupPermission adds a permission to a group.
  rpc AssignGroupPermission(AssignGroupPermissionRequest) returns (AssignGroupPermissionResponse) {
    option (google.api.http) = {
      post: "/v1/groups/{group_uid}/permissions"
      body: "*"
    };
  }

  // RevokeGroupPermission removes a permission from a group.
  rpc RevokeGroupPermission(RevokeGroupPermissionRequest) returns (RevokeGroupPermissionResponse) {
    option (google.api.http) = {
      delete: "/v1/groups/{group_uid}/permissions/{permission_uid}"
    };
  }

  // ListGroupPermissions returns all permissions assigned to a group.
  rpc ListGroupPermissions(ListGroupPermissionsRequest) returns (ListGroupPermissionsResponse) {
    option (google.api.http) = {
      get: "/v1/groups/{group_uid}/permissions"
    };
  }
}

// Request/Response stubs - will be implemented in later tasks
message CreateGroupRequest {}
message CreateGroupResponse {}
message GetGroupRequest {
  string uid = 1;
}
message UpdateGroupRequest {
  string uid = 1;
}
message UpdateGroupResponse {}
message DeleteGroupRequest {
  string uid = 1;
}
message DeleteGroupResponse {}
message ListGroupsRequest {}
message ListGroupsResponse {}
message AssignGroupPermissionRequest {
  string group_uid = 1;
}
message AssignGroupPermissionResponse {}
message RevokeGroupPermissionRequest {
  string group_uid = 1;
  string permission_uid = 2;
}
message RevokeGroupPermissionResponse {}
message ListGroupPermissionsRequest {
  string group_uid = 1;
}
message ListGroupPermissionsResponse {}
