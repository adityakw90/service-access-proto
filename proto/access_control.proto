syntax = "proto3";

// Access Control Service provides authorization and subject assignment operations.
// This service is the main entry point for access control decisions.
//
// The CheckAccess RPC is called by other services to determine if a subject
// (user, service, or system) is allowed to perform a specific action on a resource.
//
// Subject assignment operations (AssignRole, RevokeRole, ListSubjectRoles)
// manage which roles are granted to which subjects.
package access;

import "google/protobuf/timestamp.proto";
import "common.proto";

option go_package = "github.com/adityakw90/service-access-proto/gen/go/access";



// SubjectRole represents a role assigned to a subject.
message SubjectRole {
  string subject_id = 1; // subject_id is the id of the entity. e.g "user-123", "service-abc"
  string subject_type = 2; // subject_type is the type of the entity. e.g "user", "service", "system"
  string role_uid = 3; // role_uid is the id of the role. e.g "role-123", "role-abc"
  google.protobuf.Timestamp assigned_at = 4; // assigned_at is the Unix timestamp when the role was assigned
}

// CheckAccessRequest contains the parameters for an authorization check.
message CheckAccessRequest {
  string subject_id = 1; // subject_id is the id of the entity requesting access. e.g "user-123", "service-abc"
  string subject_type = 2; // subject_type is the type of the entity requesting access. e.g "user", "service", "system"
  string resource = 3; // resource is the resource being accessed. e.g "user-123", "service-abc"
  string action = 4; // action is the action being performed. e.g "read", "write", "delete"
}

// CheckAccessResponse contains the authorization decision.
message CheckAccessResponse {
  bool allowed = 1; // allowed is true if the subject has permission for the requested action
  string reason = 2; // reason provides an explanation for the decision. For granted access: may explain which roles/permissions granted access. For denied access: explains why access was denied (e.g., "no matching permissions")
}

// AssignRoleRequest assigns a role to a subject.
message AssignRoleRequest {
  string subject_id = 1; // subject_id is the id of the entity receiving the role. e.g "user-123", "service-abc"
  string subject_type = 2; // subject_type is the type of the entity receiving the role. e.g "user", "service", "system"
  string role_uid = 3; // role_uid is the id of the role to assign. e.g "role-123", "role-abc"
}

// RevokeRoleRequest removes a role assignment from a subject.
message RevokeRoleRequest {
  string subject_id = 1; // subject_id is the id of the entity revoking the role. e.g "user-123", "service-abc"
  string subject_type = 2; // subject_type is the type of the entity revoking the role. e.g "user", "service", "system"
  string role_uid = 3; // role_uid is the id of the role to revoke. e.g "role-123", "role-abc"
}

// ListSubjectRolesRequest lists all roles for a subject.
message ListSubjectRolesRequest {
  common.Pagination pagination = 1; // pagination controls the page size and ordering
  FilterRequest filter = 2; // filter controls the filtering of roles
}

message FilterRequest {
  optional string subject_id = 1; // subject_id is the id of the entity. e.g "user-123", "service-abc"
  optional string subject_type = 2; // subject_type is the type of the entity. e.g "user", "service", "system"
  optional string role_uid = 3; // role_uid is the id of the role. e.g "role-123", "role-abc"
  optional string query = 4; // query for the role to retrieve, fuzzy match
}

// ListSubjectRolesResponse returns the subject's roles.
message ListSubjectRolesResponse {
  repeated SubjectRole items = 1; // items is the list of role assignments for this subject.
  common.Meta meta = 2; // meta contains pagination metadata.
}

// AccessControlService provides authorization and subject assignment operations.
service AccessControlService {
  // CheckAccess determines if a subject is allowed to perform an action on a resource.
  //
  // This is the core authorization decision point. The service evaluates the subject's
  // assigned roles and their permissions to determine if access should be granted.
  //
  // The reason field provides transparency for debugging and audit purposes,
  // explaining why access was granted or denied.
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);

  // AssignRole assigns a role to a subject.
  // The subject can be a user, service, or any entity that needs access.
  rpc AssignRole(AssignRoleRequest) returns (common.Success);

  // RevokeRole removes a role assignment from a subject.
  rpc RevokeRole(RevokeRoleRequest) returns (common.Success);

  // ListSubjectRoles retrieves all roles assigned to a subject.
  // Useful for auditing and displaying subject permissions.
  rpc ListSubjectRoles(ListSubjectRolesRequest) returns (ListSubjectRolesResponse);
}